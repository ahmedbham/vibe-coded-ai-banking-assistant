name: Auto-Approve Copilot Workflow Runs

# This workflow auto-approves GitHub Actions workflow runs triggered by the
# GitHub Copilot coding agent.  It addresses the requirement that maintainers
# must manually click "Approve and run" for every Copilot-triggered event.
#
# Three complementary triggers are used:
#   1. workflow_run / requested — fires (from the default branch, where it is
#      trusted) when any of the named workflows is requested.  Immediately
#      approves the run if the triggering actor is Copilot.
#   2. schedule — polls every 5 minutes for any workflow runs that are still
#      in "action_required" or "waiting" state.  This is the primary fallback
#      because workflow_run-triggered runs can inherit the action_required status
#      from upstream Copilot-triggered workflows.  The scheduled job also
#      self-heals: it approves action_required runs of this workflow itself
#      (by name) so the circular dependency is broken automatically.
#   3. workflow_dispatch — allows manual triggering from the GitHub UI to
#      immediately unblock any stalled runs without waiting for the schedule.
#
# The scheduled/dispatch job also approves pending environment deployments
# (for jobs blocked at an environment protection gate), in addition to
# approving the workflow run itself.
#
# Prerequisites (one-time owner action):
#   • Create a fine-grained PAT with "Actions: Read and write" permission
#     (or a classic PAT with "repo" + "workflow" scopes) for this repository.
#   • Store it as a repository secret named COPILOT_AUTO_APPROVE_TOKEN.
#   • If the secret is absent the workflow falls back to GITHUB_TOKEN, which
#     may be sufficient depending on repository settings.
#
# Security note:
#   • This workflow file lives on the default branch and runs in that trusted
#     context — it never runs untrusted code from the Copilot PR branch.
#   • Only runs whose actor login is "Copilot" or "copilot[bot]" are approved,
#     plus runs of this workflow itself (self-healing).

on:
  workflow_run:
    workflows:
      - "CI"
      - "Validate IaC (scripts/iac-validate.sh)"
      - "Copilot Setup Steps"
      - "Auto-Approve Copilot Workflow Runs"
    types:
      - requested
  schedule:
    # Fallback poll: check every 5 minutes for stalled action_required/waiting runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # Allow manual triggering to immediately unblock any stalled runs.

permissions:
  actions: write

# Actor logins for the GitHub Copilot coding agent.
# Listed here once so both jobs stay in sync if GitHub ever changes the name.
env:
  COPILOT_LOGINS: "Copilot copilot[bot]"

jobs:
  # ── Job 1: event-driven approval ──────────────────────────────────────────
  auto-approve-event:
    name: Auto-approve on workflow_run event
    runs-on: ubuntu-latest
    # Only run when a workflow_run event is received AND the actor is Copilot.
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.actor.login == 'Copilot' ||
       github.event.workflow_run.actor.login == 'copilot[bot]')
    steps:
      - name: Approve workflow run
        uses: actions/github-script@v7
        with:
          # Prefer a dedicated PAT (actions:write) so approval succeeds even
          # when GITHUB_TOKEN lacks sufficient permissions.
          github-token: ${{ secrets.COPILOT_AUTO_APPROVE_TOKEN || github.token }}
          script: |
            const runId = context.payload.workflow_run.id;
            const actor = context.payload.workflow_run.actor?.login;
            core.info(`Attempting to approve run #${runId} triggered by ${actor}`);
            try {
              await github.rest.actions.approveWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              core.info(`✅ Approved workflow run #${runId}`);
            } catch (err) {
              // Log a warning rather than failing — the run may already be
              // approved, queued, or ineligible (e.g. same-repo push).
              core.warning(`Could not approve run #${runId}: ${err.message}`);
            }

  # ── Job 2: scheduled fallback ─────────────────────────────────────────────
  auto-approve-scheduled:
    name: Approve pending Copilot runs (scheduled poll)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Find and approve action_required and waiting Copilot runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_AUTO_APPROVE_TOKEN || github.token }}
          script: |
            const copilotLogins = new Set(process.env.COPILOT_LOGINS.split(' '));
            // Also self-heal: always approve action_required runs of this workflow itself,
            // because workflow_run-triggered runs can inherit the action_required status
            // from upstream Copilot-triggered workflows (only runs on the default branch
            // are approved to limit scope — schedule/workflow_run always run on default).
            const selfWorkflowName = context.workflow;
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            // Collect runs in action_required state (outside-contributor approval needed)
            const { data: arData } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              status: 'action_required',
              per_page: 50,
            });

            // Collect runs in waiting state (environment protection rule approval needed)
            const { data: waitingData } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              status: 'waiting',
              per_page: 50,
            });

            // A run can only have one status at a time, but we merge both lists
            // to handle all pending approval cases in a single loop.
            const allRuns = [...arData.workflow_runs, ...waitingData.workflow_runs];
            const runsById = new Map(allRuns.map(r => [r.id, r]));

            const pending = [...runsById.values()].filter(r =>
              copilotLogins.has(r.actor?.login) ||
              // Self-heal: unblock this workflow's own action_required runs (which
              // occur when workflow_run inherits action_required from upstream).
              // Restrict to the default branch so only trusted scheduler/event runs
              // are approved without an explicit Copilot actor check.
              (r.name === selfWorkflowName && r.head_branch === defaultBranch)
            );

            if (pending.length === 0) {
              core.info('No pending Copilot runs found.');
              return;
            }

            for (const run of pending) {
              core.info(`Processing run #${run.id}: "${run.name}" (status: ${run.status}) by ${run.actor?.login}`);

              // Approve the workflow run itself (for action_required/outside-contributor state)
              if (run.status === 'action_required') {
                try {
                  await github.rest.actions.approveWorkflowRun({
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    run_id: run.id,
                  });
                  core.info(`✅ Approved run #${run.id}`);
                } catch (err) {
                  core.warning(`Could not approve run #${run.id}: ${err.message}`);
                }
              }

              // Approve pending environment deployments (for waiting/environment-gate state)
              try {
                const { data: pendingDeployments } = await github.rest.actions.getPendingDeploymentsForRun({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  run_id: run.id,
                });
                if (pendingDeployments.length > 0) {
                  const environmentIds = pendingDeployments.map(d => d.environment.id);
                  await github.rest.actions.reviewPendingDeploymentsForRun({
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    run_id: run.id,
                    environment_ids: environmentIds,
                    state: 'approved',
                    comment: 'Auto-approved for Copilot coding agent run',
                  });
                  core.info(`✅ Approved ${pendingDeployments.length} pending environment(s) for run #${run.id}`);
                }
              } catch (envErr) {
                core.warning(`Could not approve environments for run #${run.id}: ${envErr.message}`);
              }
            }
