name: Azure Developer CLI – Provision & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token
  contents: read

env:
  AZURE_RESOURCE_GROUP: VIDE_DEV-RG-1

jobs:
  provision-and-deploy:
    name: azd provision & deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: azure/setup-azd@v2

      - name: Log in with azd (OIDC)
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --federated-credential-provider "github" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Set azd environment
        run: |
          azd env new dev --no-prompt || azd env select dev
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION || 'westus2' }}"
          azd env set AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP || 'rg-banking-dev' }}"
          azd config set alpha.resourceGroupDeployments on
        env:
          AZURE_CORE_OUTPUT: none

      - name: azd provision (infrastructure)
        run: azd env select dev || azd env new dev --no-prompt
        env:
          AZURE_CORE_OUTPUT: none
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-banking-dev' }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus2' }}

      - name: azd deploy (services)
        run: azd deploy --no-prompt
        env:
          AZURE_CORE_OUTPUT: none
