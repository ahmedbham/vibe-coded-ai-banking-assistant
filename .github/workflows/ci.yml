name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  bicep-validate:
    name: Bicep – build & validate
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          az bicep install

      - name: Build (compile) Bicep templates
        run: az bicep build --file infra/main.bicep

  backend-ci:
    name: Backend – install & test
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install dependencies
        run: uv pip install --system --prerelease=if-necessary-or-explicit ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest
        run: pytest --tb=short

  frontend-ci:
    name: Frontend simple-chat – install & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/simple-chat

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/simple-chat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
