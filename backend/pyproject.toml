[project]
name = "banking-assistant-backend"
version = "0.1.0"
description = "Multi-agent banking assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "azure-identity>=1.17.0",
    "azure-storage-blob>=12.22.0",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-monitor-opentelemetry>=1.6.0",
    "fastmcp>=2.0.0",
    # Microsoft Agent Framework – pre-release packages; transitive pre-release
    # deps are listed explicitly so --prerelease=if-necessary-or-explicit works.
    "agent-framework-azure-ai>=1.0.0rc1",
    "agent-framework-core>=1.0.0rc1",
    "agent-framework-orchestrations>=1.0.0b0",
    "azure-ai-agents>=1.2.0b5",
    "azure-ai-projects>=2.0.0b3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests that require live services or full stack",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "api",
    "services",
]
