# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: vibe-coded-ai-banking-assistant

metadata:
  template: vibe-coded-ai-banking-assistant@0.0.1

# ---------------------------------------------------------------------------
# Infrastructure – Bicep templates in infra/
# ---------------------------------------------------------------------------
infra:
  provider: bicep
  path: infra
  module: main

# ---------------------------------------------------------------------------
# Application services
# ---------------------------------------------------------------------------
services:
  backend:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
  transactions-service:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile.transactions
      context: .
  payments-service:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile.payments
      context: .
  account-mcp:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile.account-mcp
      context: .
  transactions-mcp:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile.transactions-mcp
      context: .
  payments-mcp:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile.payments-mcp
      context: .
  chat-api:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile.chat-api
      context: .
  simple-chat:
    project: ./frontend/simple-chat
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
