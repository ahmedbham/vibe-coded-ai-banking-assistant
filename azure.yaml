# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: vibe-coded-ai-banking-assistant

metadata:
  template: vibe-coded-ai-banking-assistant@0.0.1

# ---------------------------------------------------------------------------
# Infrastructure – Bicep templates in infra/
# ---------------------------------------------------------------------------
infra:
  provider: bicep
  path: infra
  module: main

# ---------------------------------------------------------------------------
# Application services
# ---------------------------------------------------------------------------
services:
  backend:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./backend/Dockerfile
      context: ./backend
  transactions-service:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./backend/Dockerfile.transactions
      context: ./backend
  payments-service:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./backend/Dockerfile.payments
      context: ./backend
  account-mcp:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./backend/Dockerfile.account-mcp
      context: ./backend
  transactions-mcp:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./backend/Dockerfile.transactions-mcp
      context: ./backend
  payments-mcp:
    project: ./backend
    language: py
    host: containerapp
    docker:
      path: ./backend/Dockerfile.payments-mcp
      context: ./backend
